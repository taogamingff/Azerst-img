<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Azerst Image VN</title>

  <meta
    name="description"
    content="Azerst Image VN - Upload hình ảnh và nhận URL trực tiếp"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #1d2a3a,
          #080b10 55%
        );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;

      background: rgba(255, 255, 255, 0.07);

      border: 1px solid rgba(255,255,255,0.12);

      backdrop-filter: blur(20px);

      border-radius: 24px;

      padding: 28px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aeb8c7;
      margin-bottom: 28px;
    }

    .upload-box {
      border: 2px dashed rgba(255,255,255,0.2);

      border-radius: 18px;

      padding: 35px 20px;

      text-align: center;

      cursor: pointer;

      transition: 0.2s;
    }

    .upload-box:hover {
      border-color: #4da3ff;
      background: rgba(77,163,255,0.06);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    input[type="file"] {
      display: none;
    }

    .file-name {
      margin-top: 12px;
      color: #b8c2d1;
      font-size: 14px;
      word-break: break-all;
    }

    .api-box {
      margin-top: 20px;
    }

    .api-box label {
      display: block;
      margin-bottom: 8px;
      color: #b8c2d1;
      font-size: 14px;
    }

    .api-box input {
      width: 100%;
      padding: 13px;

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 12px;

      background: rgba(0,0,0,0.25);

      color: white;

      outline: none;
    }

    button {
      width: 100%;

      margin-top: 20px;

      padding: 15px;

      border: 0;

      border-radius: 13px;

      background: #1683ff;

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      background: #006fe6;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      display: none;

      margin-top: 20px;

      padding: 15px;

      border-radius: 14px;

      background: rgba(0,0,0,0.25);
    }

    .result-title {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .url {
      display: block;

      padding: 12px;

      border-radius: 10px;

      background: rgba(255,255,255,0.08);

      color: #69b3ff;

      word-break: break-all;

      font-size: 14px;
    }

    .copy {
      margin-top: 10px;

      padding: 11px;

      background: rgba(255,255,255,0.1);

      font-size: 14px;
    }

    .status {
      margin-top: 15px;

      text-align: center;

      color: #aeb8c7;

      font-size: 14px;
    }

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #718096;

      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Azerst Image VN
    </div>

    <div class="subtitle">
      Upload ảnh → Nhận URL trực tiếp
    </div>

    <label
      class="upload-box"
      for="imageInput"
    >

      <div class="upload-icon">
        🖼️
      </div>

      <div>
        Nhấn để chọn hình ảnh
      </div>

      <div class="file-name" id="fileName">
        JPG • PNG • WEBP • GIF
      </div>

    </label>

    <input
      type="file"
      id="imageInput"
      accept="image/jpeg,image/png,image/webp,image/gif"
    >

    <div class="api-box">

      <label>
        API Key
      </label>

      <input
        type="password"
        id="apiKey"
        placeholder="Nhập API Key..."
      >

    </div>

    <button
      id="uploadButton"
    >
      Upload hình ảnh
    </button>

    <div
      class="status"
      id="status"
    ></div>

    <div
      class="result"
      id="result"
    >

      <div class="result-title">
        ✅ Upload thành công
      </div>

      <div
        class="url"
        id="imageUrl"
      ></div>

      <button
        class="copy"
        id="copyButton"
      >
        📋 Sao chép URL
      </button>

    </div>

    <div class="footer">
      Azerst Image VN
    </div>

  </div>

<script>

const imageInput =
  document.getElementById("imageInput");

const fileName =
  document.getElementById("fileName");

const apiKey =
  document.getElementById("apiKey");

const uploadButton =
  document.getElementById("uploadButton");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const imageUrl =
  document.getElementById("imageUrl");

const copyButton =
  document.getElementById("copyButton");


imageInput.addEventListener(
  "change",
  () => {

    if (!imageInput.files.length) {
      fileName.textContent =
        "JPG • PNG • WEBP • GIF";

      return;
    }

    const file =
      imageInput.files[0];

    fileName.textContent =
      file.name;

  }
);


uploadButton.addEventListener(
  "click",
  async () => {

    const file =
      imageInput.files[0];

    const key =
      apiKey.value.trim();

    if (!file) {

      status.textContent =
        "❌ Vui lòng chọn hình ảnh.";

      return;
    }

    if (!key) {

      status.textContent =
        "❌ Vui lòng nhập API Key.";

      return;
    }

    const formData =
      new FormData();

    formData.append(
      "image",
      file
    );

    uploadButton.disabled =
      true;

    uploadButton.textContent =
      "⏳ Đang upload...";

    status.textContent =
      "";

    result.style.display =
      "none";

    try {

      const response =
        await fetch(
          "/api/upload",
          {
            method: "POST",

            headers: {
              "x-api-key": key
            },

            body: formData
          }
        );

      const data =
        await response.json();

      if (!response.ok || !data.ok) {

        throw new Error(
          data.error ||
          "Upload thất bại"
        );

      }

      imageUrl.textContent =
        data.url;

      result.style.display =
        "block";

      status.textContent =
        "Upload thành công!";

    } catch (error) {

      status.textContent =
        "❌ " + error.message;

    } finally {

      uploadButton.disabled =
        false;

      uploadButton.textContent =
        "Upload hình ảnh";

    }

  }
);


copyButton.addEventListener(
  "click",
  async () => {

    const url =
      imageUrl.textContent;

    await navigator.clipboard.writeText(
      url
    );

    copyButton.textContent =
      "✅ Đã sao chép";

    setTimeout(
      () => {

        copyButton.textContent =
          "📋 Sao chép URL";

      },
      1500
    );

  }
);

</script>

</body>
  </html>
