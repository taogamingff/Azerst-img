<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Azerst Image VN</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: white;

  background:
    radial-gradient(
      circle at top,
      #1c2d42,
      #07090d 60%
    );

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;
}

.container {

  width: 100%;

  max-width: 520px;

  padding: 28px;

  border-radius: 24px;

  background:
    rgba(255,255,255,0.07);

  border:
    1px solid rgba(255,255,255,0.12);

  box-shadow:
    0 20px 70px
    rgba(0,0,0,0.5);

  backdrop-filter:
    blur(20px);
}

.logo {

  text-align: center;

  font-size: 30px;

  font-weight: 800;

  margin-bottom: 7px;
}

.subtitle {

  text-align: center;

  color: #9ca9ba;

  margin-bottom: 25px;
}

.upload {

  display: block;

  padding: 40px 20px;

  text-align: center;

  border:
    2px dashed
    rgba(255,255,255,0.2);

  border-radius: 18px;

  cursor: pointer;

  transition: .2s;
}

.upload:hover {

  border-color: #3498ff;

  background:
    rgba(52,152,255,.06);
}

.icon {

  font-size: 50px;

  margin-bottom: 12px;
}

#fileInput {

  display: none;
}

.file {

  margin-top: 10px;

  color: #8794a6;

  font-size: 13px;

  word-break: break-all;
}

button {

  width: 100%;

  border: 0;

  border-radius: 13px;

  padding: 15px;

  margin-top: 18px;

  color: white;

  background: #1683ff;

  font-size: 16px;

  font-weight: 700;

  cursor: pointer;
}

button:hover {

  background: #006ee5;
}

button:disabled {

  opacity: .5;

  cursor: not-allowed;
}

.status {

  text-align: center;

  margin-top: 15px;

  color: #aeb8c7;

  font-size: 14px;
}

.result {

  display: none;

  margin-top: 20px;

  padding: 17px;

  border-radius: 15px;

  background:
    rgba(0,0,0,.25);
}

.success {

  font-weight: 700;

  margin-bottom: 10px;
}

.url {

  padding: 13px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.08);

  color: #55adff;

  font-size: 13px;

  word-break: break-all;
}

.copy {

  margin-top: 10px;

  background:
    rgba(255,255,255,.12);
}

.preview {

  display: none;

  width: 100%;

  max-height: 300px;

  object-fit: contain;

  border-radius: 12px;

  margin-top: 15px;
}

.footer {

  text-align: center;

  color: #657184;

  font-size: 12px;

  margin-top: 20px;
}

</style>

</head>

<body>

<div class="container">

  <div class="logo">
    Azerst Image VN
  </div>

  <div class="subtitle">
    Upload ảnh miễn phí • Nhận URL trực tiếp
  </div>

  <label
    class="upload"
    for="fileInput"
  >

    <div class="icon">
      🖼️
    </div>

    <div>
      Chọn hình ảnh để upload
    </div>

    <div
      class="file"
      id="fileName"
    >
      JPG • PNG • WEBP • GIF
    </div>

  </label>

  <input
    id="fileInput"
    type="file"
    accept="image/jpeg,image/png,image/webp,image/gif"
  >

  <button
    id="uploadButton"
  >
    🚀 Upload hình ảnh
  </button>

  <div
    class="status"
    id="status"
  ></div>

  <div
    class="result"
    id="result"
  >

    <div class="success">
      ✅ Upload thành công
    </div>

    <div
      class="url"
      id="url"
    ></div>

    <img
      class="preview"
      id="preview"
    >

    <button
      class="copy"
      id="copyButton"
    >
      📋 Sao chép URL
    </button>

  </div>

  <div class="footer">
    Azerst Image VN
  </div>

</div>

<script>

const fileInput =
  document.getElementById(
    "fileInput"
  );

const fileName =
  document.getElementById(
    "fileName"
  );

const uploadButton =
  document.getElementById(
    "uploadButton"
  );

const status =
  document.getElementById(
    "status"
  );

const result =
  document.getElementById(
    "result"
  );

const url =
  document.getElementById(
    "url"
  );

const preview =
  document.getElementById(
    "preview"
  );

const copyButton =
  document.getElementById(
    "copyButton"
  );


fileInput.addEventListener(
  "change",
  function () {

    if (!this.files.length) {

      fileName.textContent =
        "JPG • PNG • WEBP • GIF";

      return;
    }

    fileName.textContent =
      this.files[0].name;
  }
);


uploadButton.addEventListener(
  "click",
  async function () {

    const file =
      fileInput.files[0];

    if (!file) {

      status.textContent =
        "❌ Vui lòng chọn ảnh.";

      return;
    }

    const formData =
      new FormData();

    formData.append(
      "image",
      file
    );

    uploadButton.disabled =
      true;

    uploadButton.textContent =
      "⏳ Đang upload...";

    status.textContent =
      "Đang xử lý...";

    result.style.display =
      "none";

    preview.style.display =
      "none";

    try {

      const response =
        await fetch(
          "/api/upload",
          {
            method: "POST",
            body: formData
          }
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.ok
      ) {

        throw new Error(
          data.error ||
          "Upload thất bại"
        );
      }

      url.textContent =
        data.url;

      preview.src =
        data.url;

      result.style.display =
        "block";

      preview.style.display =
        "block";

      status.textContent =
        "✅ Hoàn tất!";

    } catch (error) {

      status.textContent =
        "❌ " + error.message;

    } finally {

      uploadButton.disabled =
        false;

      uploadButton.textContent =
        "🚀 Upload hình ảnh";
    }

  }
);


copyButton.addEventListener(
  "click",
  async function () {

    const text =
      url.textContent;

    try {

      await navigator.clipboard.writeText(
        text
      );

      copyButton.textContent =
        "✅ Đã sao chép URL";

      setTimeout(
        () => {

          copyButton.textContent =
            "📋 Sao chép URL";

        },
        1500
      );

    } catch {

      alert(text);

    }

  }
);

</script>

</body>

</html>
