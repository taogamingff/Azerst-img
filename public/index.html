/* =====================================================
   RANDOM 6 CHARACTERS
===================================================== */

function randomName() {

  const chars =
    "abcdefghijklmnopqrstuvwxyz0123456789";

  const bytes =
    new Uint8Array(6);

  crypto.getRandomValues(
    bytes
  );

  let name = "";

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    name +=
      chars[
        bytes[i] %
        chars.length
      ];

  }

  return name;

}


/* =====================================================
   EXTENSION
===================================================== */

function extension(type) {

  switch(type) {

    case "image/png":
      return ".png";

    case "image/jpeg":
      return ".jpg";

    case "image/webp":
      return ".webp";

    case "image/gif":
      return ".gif";

    default:
      return "";

  }

}


/* =====================================================
   SIZE
===================================================== */

function formatSize(bytes) {

  if (
    bytes <
    1024
  ) {

    return (
      bytes +
      " B"
    );

  }


  if (
    bytes <
    1024 ** 2
  ) {

    return (
      (bytes / 1024)
      .toFixed(2) +
      " KB"
    );

  }


  if (
    bytes <
    1024 ** 3
  ) {

    return (
      (bytes / 1024 ** 2)
      .toFixed(2) +
      " MB"
    );

  }


  return (
    (bytes / 1024 ** 3)
    .toFixed(2) +
    " GB"
  );

}

===================================================== */

function showError(message) {

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";

}


function hideError() {

  errorBox.style.display =
    "none";

}


/* =====================================================
   SELECT FILE
===================================================== */

fileInput.addEventListener(
  "change",
  () => {

    const file =
      fileInput.files?.[0];

    if (file) {

      uploadFile(file);

    }

  }
);


/* =====================================================
   DRAG
===================================================== */

uploadArea.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

    uploadArea.style.borderColor =
      "#ff66d8";

  }
);


uploadArea.addEventListener(
  "dragleave",
  () => {

    uploadArea.style.borderColor =
      "rgba(255,255,255,.20)";

  }
);


uploadArea.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    uploadArea.style.borderColor =
      "rgba(255,255,255,.20)";

    const file =
      event.dataTransfer
        .files?.[0];

    if (file) {

      uploadFile(file);

    }

  }
);


/* =====================================================
   UPLOAD
===================================================== */

async function uploadFile(file) {

  hideError();

  result.style.display =
    "none";

  preview.style.display =
    "none";


  /* TYPE */

  if (
    !ALLOWED_TYPES.includes(
      file.type
    )
  ) {

    showError(
      "Định dạng không được hỗ trợ. Vui lòng chọn PNG, JPG, WEBP hoặc GIF."
    );

    return;

  }


  /* SIZE */

  if (
    file.size >
    MAX_SIZE
  ) {

    showError(
      "Ảnh vượt quá giới hạn 65 GB."
    );

    return;

  }


  /* INFORMATION */

  fileBox.style.display =
    "block";

  fileName.textContent =
    file.name;

  fileSize.textContent =
    formatSize(
      file.size
    );

  fileType.textContent =
    file.type
      .replace(
        "image/",
        ""
      )
      .toUpperCase();


  /* PROGRESS */

  progressBox.style.display =
    "block";

  progressBar.style.width =
    "0%";

  progressText.textContent =
    "0%";

  status.textContent =
    "Đang chuẩn bị upload...";


  try {

    /*
     * Tạo tên:
     *
     * 6 ký tự + đuôi
     *
     * Ví dụ:
     *
     * 7fas39.png
     */

    const pathname =
      randomName() +
      extension(
        file.type
      );


    const blob =
      await upload(
        pathname,
        file,
        {

          access:
            "public",

          handleUploadUrl:
            "/api/upload",

          multipart:
            true,

          clientPayload:
            JSON.stringify({

              originalName:
                file.name,

              contentType:
                file.type,

              size:
                file.size

            }),

          onUploadProgress:
            event => {

              const percent =
                Math.round(
                  event.percentage
                );

              progressBar.style.width =
                percent +
                "%";

              progressText.textContent =
                percent +
                "%";


              if (
                percent >=
                100
              ) {

                status.textContent =
                  "Đang hoàn tất...";

              } else {

                status.textContent =
                  "Đang upload ảnh...";

              }

            }

        }
      );


    /*
     * URL chính thức.
     *
     * Vì vercel.json rewrite
     * pathname này sang Blob,
     * người dùng có URL:
     *
     * https://Azerst-Image-VN.vercel.app/7fas39.png
     */

    const finalURL =
      "https://Azerst-Image-VN.vercel.app/" +
      pathname;


    progressBar.style.width =
      "100%";

    progressText.textContent =
      "100%";

    status.textContent =
      "Upload thành công!";


    urlInput.value =
      finalURL;


    result.style.display =
      "block";


    /*
     * Preview dùng Blob URL
     * thật để ảnh hiển thị ngay.
     */

    previewImage.src =
      blob.url;

    preview.style.display =
      "block";


    result.scrollIntoView({
      behavior:
        "smooth",
      block:
        "nearest"
    });


  } catch(error) {

    console.error(
      error
    );

    progressBox.style.display =
      "none";

    showError(
      error?.message ||
      "Upload thất bại. Vui lòng thử lại."
    );

  }

}


/* =====================================================
   COPY
===================================================== */

copyBtn.addEventListener(
  "click",
  async () => {

    const url =
      urlInput.value;

    if (!url)
      return;


    try {

      await navigator.clipboard.writeText(
        url
      );

    } catch {

      urlInput.select();

      document.execCommand(
        "copy"
      );

    }


    copyBtn.textContent =
      "Đã Sao Chép ✓";


    setTimeout(
      () => {

        copyBtn.textContent =
          "Sao Chép";

      },
      1500
    );

  }
);


/* =====================================================
   UPLOAD AGAIN
===================================================== */

againBtn.addEventListener(
  "click",
  () => {

    fileInput.value =
      "";

    fileBox.style.display =
      "none";

    progressBox.style.display =
      "none";

    result.style.display =
      "none";

    preview.style.display =
      "none";

    hideError();

    window.scrollTo({
      top: 0,
      behavior:
        "smooth"
    });

  }
);

</script>

</body>
