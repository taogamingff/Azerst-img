<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Azerst - CÔNG CỤ CHÈN ẢNH TẠO LINK URL</title>

  <meta
    name="description"
    content="Công cụ chèn ảnh và tạo link URL trực tiếp nhanh chóng từ Azerst."
  >

  <style>
    @font-face {
      font-family: "GFF-Latin-Bold";

      src:
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2")
        format("woff2"),

        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff")
        format("woff");
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "GFF-Latin-Bold", Arial, sans-serif;

      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(10, 10, 35, 0.96),
          rgba(35, 8, 55, 0.95)
        ),

        url("https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=2400&q=90");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255, 0, 170, 0.18),
          transparent 30%
        ),

        radial-gradient(
          circle at 80% 80%,
          rgba(0, 170, 255, 0.18),
          transparent 30%
        );
    }

    .container {
      position: relative;

      width: min(920px, calc(100% - 28px));

      margin: 0 auto;

      padding: 35px 0 60px;
    }

    .header {
      text-align: center;

      margin-bottom: 25px;
    }

    .logo {
      width: 78px;
      height: 78px;

      object-fit: contain;

      border-radius: 22px;

      margin-bottom: 15px;

      box-shadow:
        0 0 25px rgba(255, 80, 220, 0.55);
    }

    .title {
      font-size: clamp(24px, 5vw, 42px);

      line-height: 1.15;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #ff8be8,
          #8edcff,
          #ffffff
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .description {
      margin-top: 12px;

      color: rgba(255, 255, 255, 0.72);

      font-size: 14px;

      line-height: 1.6;
    }

    .card {
      position: relative;

      background: rgba(15, 13, 35, 0.78);

      border: 1px solid rgba(255, 255, 255, 0.13);

      border-radius: 28px;

      padding: 25px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.45),

        inset 0 1px 0
        rgba(255, 255, 255, 0.08);
    }

    .upload-area {
      position: relative;

      border: 2px dashed rgba(255, 255, 255, 0.22);

      border-radius: 22px;

      padding: 45px 20px;

      text-align: center;

      cursor: pointer;

      transition: 0.25s ease;

      background: rgba(255, 255, 255, 0.035);
    }

    .upload-area:hover {
      border-color: #ff75db;

      background: rgba(255, 75, 210, 0.07);

      transform: translateY(-2px);
    }

    .upload-icon {
      font-size: 55px;

      margin-bottom: 10px;
    }

    .upload-title {
      font-size: 21px;

      margin-bottom: 8px;
    }

    .upload-subtitle {
      font-size: 13px;

      color: rgba(255, 255, 255, 0.58);

      line-height: 1.7;
    }

    #fileInput {
      display: none;
    }

    .limit {
      margin-top: 12px;

      display: inline-block;

      padding: 7px 12px;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.07);

      color: rgba(255, 255, 255, 0.7);

      font-size: 12px;
    }

    .file-box {
      display: none;

      margin-top: 20px;

      padding: 17px;

      border-radius: 18px;

      background: rgba(255, 255, 255, 0.055);

      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    .file-row {
      display: flex;

      justify-content: space-between;

      gap: 15px;

      padding: 8px 0;

      border-bottom: 1px solid
        rgba(255, 255, 255, 0.07);
    }

    .file-row:last-child {
      border-bottom: 0;
    }

    .label {
      color: rgba(255, 255, 255, 0.52);

      font-size: 13px;
    }

    .value {
      text-align: right;

      word-break: break-all;

      font-size: 13px;
    }

    .progress-box {
      display: none;

      margin-top: 20px;
    }

    .progress-top {
      display: flex;

      justify-content: space-between;

      margin-bottom: 8px;

      font-size: 13px;
    }

    .progress {
      width: 100%;

      height: 11px;

      overflow: hidden;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.1);
    }

    .progress-bar {
      width: 0%;

      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #ff4fd8,
          #8b7cff,
          #3edcff
        );

      transition: width 0.2s ease;
    }

    .status {
      margin-top: 10px;

      text-align: center;

      font-size: 13px;

      color: rgba(255, 255, 255, 0.65);
    }

    .result {
      display: none;

      margin-top: 22px;

      padding: 20px;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          rgba(57, 255, 176, 0.08),
          rgba(66, 140, 255, 0.08)
        );

      border: 1px solid
        rgba(100, 255, 190, 0.2);
    }

    .result-title {
      font-size: 18px;

      margin-bottom: 12px;
    }

    .url-box {
      display: flex;

      gap: 8px;
    }

    .url-input {
      flex: 1;

      min-width: 0;

      height: 46px;

      padding: 0 13px;

      border: 1px solid
        rgba(255, 255, 255, 0.13);

      border-radius: 12px;

      outline: none;

      background: rgba(0, 0, 0, 0.25);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 13px;
    }

    .copy-btn {
      height: 46px;

      padding: 0 17px;

      border: 0;

      border-radius: 12px;

      cursor: pointer;

      color: white;

      font-family: inherit;

      background:
        linear-gradient(
          135deg,
          #ff3ecb,
          #755cff
        );

      transition: 0.2s;
    }

    .copy-btn:hover {
      transform: translateY(-1px);

      filter: brightness(1.12);
    }

    .preview {
      display: none;

      margin-top: 18px;

      text-align: center;
    }

    .preview img {
      max-width: 100%;

      max-height: 450px;

      border-radius: 15px;

      object-fit: contain;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.4);
    }

    .error {
      display: none;

      margin-top: 17px;

      padding: 13px 15px;

      border-radius: 12px;

      color: #ffb9b9;

      background: rgba(255, 40, 40, 0.1);

      border: 1px solid
        rgba(255, 80, 80, 0.18);

      font-size: 13px;
    }

    .footer {
      text-align: center;

      margin-top: 22px;

      color: rgba(255, 255, 255, 0.4);

      font-size: 12px;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 22px;
      }

      .card {
        padding: 15px;
        border-radius: 22px;
      }

      .upload-area {
        padding: 35px 15px;
      }

      .url-box {
        flex-direction: column;
      }

      .copy-btn {
        width: 100%;
      }

      .file-row {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">

    <img
      class="logo"
      src="https://img-ffvn-tgm-com.vercel.app/images/3rYKxqbI.png"
      alt="Azerst"
    >

    <h1 class="title">
      Azerst - CÔNG CỤ CHÈN ẢNH TẠO LINK URL
    </h1>

    <p class="description">
      Công cụ chèn ảnh và tạo link URL trực tiếp nhanh chóng từ Azerst.
      Hỗ trợ Android, iPhone và máy tính.
    </p>

  </header>


  <main class="card">

    <label
      class="upload-area"
      id="uploadArea"
      for="fileInput"
    >

      <div class="upload-icon">
        🖼️
      </div>

      <div class="upload-title">
        Chọn hình ảnh để upload
      </div>

      <div class="upload-subtitle">
        Nhấn vào đây hoặc kéo thả hình ảnh vào khu vực này
        <br>
        PNG • JPG • WEBP • GIF
      </div>

      <div class="limit">
        Tối đa: 65 GB
      </div>

    </label>

    <input
      type="file"
      id="fileInput"
      accept="image/png,image/jpeg,image/webp,image/gif"
    >


    <div class="file-box" id="fileBox">

      <div class="file-row">
        <span class="label">Tên File</span>
        <span
          class="value"
          id="fileName"
        >
        </span>
      </div>

      <div class="file-row">
        <span class="label">Dung Lượng</span>
        <span
          class="value"
          id="fileSize"
        >
        </span>
      </div>

      <div class="file-row">
        <span class="label">Định Dạng</span>
        <span
          class="value"
          id="fileType"
        >
        </span>
      </div>

    </div>


    <div
      class="progress-box"
      id="progressBox"
    >

      <div class="progress-top">

        <span>
          Đang upload...
        </span>

        <span id="progressText">
          0%
        </span>

      </div>

      <div class="progress">
        <div
          class="progress-bar"
          id="progressBar"
        ></div>
      </div>

      <div
        class="status"
        id="status"
      >
        Đang chuẩn bị...
      </div>

    </div>


    <div
      class="error"
      id="errorBox"
    ></div>


    <div
      class="result"
      id="result"
    >

      <div class="result-title">
        ✅ Upload thành công
      </div>

      <div class="url-box">

        <input
          class="url-input"
          id="urlInput"
          readonly
        >

        <button
          class="copy-btn"
          id="copyBtn"
          type="button"
        >
          Sao chép
        </button>

      </div>

      <div
        class="preview"
        id="preview"
      >

        <img
          id="previewImage"
          alt="Preview"
        >

      </div>

    </div>

  </main>


  <div class="footer">
    © Azerst Image VN • Fast Image Hosting
  </div>

</div>


<script type="module">

  import {
    upload
  }
  from "https://cdn.jsdelivr.net/npm/@vercel/blob@2.0.0/+esm";


  const fileInput =
    document.getElementById("fileInput");

  const uploadArea =
    document.getElementById("uploadArea");

  const fileBox =
    document.getElementById("fileBox");

  const fileName =
    document.getElementById("fileName");

  const fileSize =
    document.getElementById("fileSize");

  const fileType =
    document.getElementById("fileType");

  const progressBox =
    document.getElementById("progressBox");

  const progressBar =
    document.getElementById("progressBar");

  const progressText =
    document.getElementById("progressText");

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const urlInput =
    document.getElementById("urlInput");

  const copyBtn =
    document.getElementById("copyBtn");

  const preview =
    document.getElementById("preview");

  const previewImage =
    document.getElementById("previewImage");

  const errorBox =
    document.getElementById("errorBox");


  const MAX_SIZE =
    65 * 1024 * 1024 * 1024;


  const allowedTypes = [
    "image/png",
    "image/jpeg",
    "image/webp",
    "image/gif"
  ];


  function randomName(length = 6) {

    const chars =
      "abcdefghijklmnopqrstuvwxyz0123456789";

    const bytes =
      new Uint8Array(length);

    crypto.getRandomValues(bytes);

    let result = "";

    for (let i = 0; i < length; i++) {

      result +=
        chars[bytes[i] % chars.length];

    }

    return result;
  }


  function getExtension(type) {

    if (type === "image/png")
      return ".png";

    if (type === "image/jpeg")
      return ".jpg";

    if (type === "image/webp")
      return ".webp";

    if (type === "image/gif")
      return ".gif";

    return "";
  }


  function formatSize(bytes) {

    if (bytes < 1024)
      return bytes + " B";

    if (bytes < 1024 ** 2)
      return (bytes / 1024).toFixed(2) + " KB";

    if (bytes < 1024 ** 3)
      return (bytes / 1024 ** 2).toFixed(2) + " MB";

    return (bytes / 1024 ** 3).toFixed(2) + " GB";
  }


  function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";
  }


  function hideError() {

    errorBox.style.display = "none";
  }


  function resetResult() {

    result.style.display = "none";

    preview.style.display = "none";

    urlInput.value = "";

    previewImage.removeAttribute("src");

  }


  fileInput.addEventListener(
    "change",
    () => {

      const file =
        fileInput.files?.[0];

      if (file) {
        uploadFile(file);
      }

    }
  );


  uploadArea.addEventListener(
    "dragover",
    event => {

      event.preventDefault();

      uploadArea.style.borderColor =
        "#ff75db";

    }
  );


  uploadArea.addEventListener(
    "dragleave",
    () => {

      uploadArea.style.borderColor =
        "rgba(255,255,255,0.22)";

    }
  );


  uploadArea.addEventListener(
    "drop",
    event => {

      event.preventDefault();

      uploadArea.style.borderColor =
        "rgba(255,255,255,0.22)";

      const file =
        event.dataTransfer.files?.[0];

      if (file) {
        uploadFile(file);
      }

    }
  );


  async function uploadFile(file) {

    hideError();

    resetResult();

    if (!allowedTypes.includes(file.type)) {

      showError(
        "Định dạng không được hỗ trợ. Chỉ nhận PNG, JPG, WEBP và GIF."
      );

      return;
    }


    if (file.size > MAX_SIZE) {

      showError(
        "File vượt quá giới hạn 65 GB."
      );

      return;
    }


    fileBox.style.display = "block";

    fileName.textContent =
      file.name;

    fileSize.textContent =
      formatSize(file.size);

    fileType.textContent =
      file.type.replace(
        "image/",
        ""
      ).toUpperCase();


    progressBox.style.display =
      "block";

    progressBar.style.width =
      "0%";

    progressText.textContent =
      "0%";

    status.textContent =
      "Đang kết nối máy chủ...";


    try {

      /*
       * Tên URL chỉ 6 ký tự.
       *
       * Ví dụ:
       * 7fas39.png
       */
      const extension =
        getExtension(file.type);

      const shortName =
        randomName(6) + extension;


      const resultBlob =
        await upload(
          shortName,
          file,
          {
            access: "public",

            handleUploadUrl:
              "/api/upload",

            multipart: true,

            clientPayload:
              JSON.stringify({
                originalName:
                  file.name,

                contentType:
                  file.type,

                size:
                  file.size
              }),

            onUploadProgress:
              event => {

                const percentage =
                  Math.round(
                    event.percentage
                  );

                progressBar.style.width =
                  percentage + "%";

                progressText.textContent =
                  percentage + "%";

                if (
                  percentage >= 100
                ) {

                  status.textContent =
                    "Đang hoàn tất...";

                } else {

                  status.textContent =
                    "Đang upload hình ảnh...";

                }

              }
          }
        );


      /*
       * Vercel Blob trả về URL thật.
       *
       * Nếu bạn đã cấu hình rewrite
       * ở vercel.json thì đổi sang
       * Azerst-Image-VN.vercel.app/...
       */
      let finalUrl =
        resultBlob.url;


      /*
       * Nếu Blob URL có dạng:
       *
       * https://abc.public.blob.vercel-storage.com/7fas39.png
       *
       * thì lấy pathname:
       *
       * /7fas39.png
       *
       * và hiển thị domain Azerst.
       */
      try {

        const blobUrl =
          new URL(resultBlob.url);

        finalUrl =
          "https://Azerst-Image-VN.vercel.app"
          + blobUrl.pathname;

      } catch {

        finalUrl =
          resultBlob.url;

      }


      progressBar.style.width =
        "100%";

      progressText.textContent =
        "100%";

      status.textContent =
        "Upload hoàn tất!";


      urlInput.value =
        finalUrl;


      result.style.display =
        "block";


      previewImage.src =
        resultBlob.url;


      preview.style.display =
        "block";


      result.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });


    } catch (error) {

      console.error(error);

      progressBox.style.display =
        "none";

      showError(
        error?.message ||
        "Upload thất bại. Vui lòng thử lại."
      );

    }

  }


  copyBtn.addEventListener(
    "click",
    async () => {

      const url =
        urlInput.value;

      if (!url)
        return;

      try {

        await navigator.clipboard.writeText(
          url
        );

        copyBtn.textContent =
          "Đã sao chép ✓";

        setTimeout(
          () => {
            copyBtn.textContent =
              "Sao chép";
          },
          1500
        );

      } catch {

        urlInput.select();

        document.execCommand(
          "copy"
        );

        copyBtn.textContent =
          "Đã sao chép ✓";

      }

    }
  );

</script>

</body>
</html>
