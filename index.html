<script type="module">

/*
 * QUAN TRỌNG:
 *
 * Dùng đúng package client.
 */

import {
  upload
}
from
"https://cdn.jsdelivr.net/npm/@vercel/blob@2.7.0/client/+esm";


const fileInput =
  document.getElementById(
    "fileInput"
  );

const fileBox =
  document.getElementById(
    "fileBox"
  );

const fileName =
  document.getElementById(
    "fileName"
  );

const fileSize =
  document.getElementById(
    "fileSize"
  );

const fileType =
  document.getElementById(
    "fileType"
  );

const progressBox =
  document.getElementById(
    "progressBox"
  );

const progressBar =
  document.getElementById(
    "progressBar"
  );

const progressText =
  document.getElementById(
    "progressText"
  );

const status =
  document.getElementById(
    "status"
  );

const result =
  document.getElementById(
    "result"
  );

const urlInput =
  document.getElementById(
    "urlInput"
  );

const copyButton =
  document.getElementById(
    "copyButton"
  );

const otherButton =
  document.getElementById(
    "otherButton"
  );

const preview =
  document.getElementById(
    "preview"
  );

const previewImage =
  document.getElementById(
    "previewImage"
  );

const errorBox =
  document.getElementById(
    "errorBox"
  );


const MAX_SIZE =
  65 * 1024 * 1024 * 1024;


const ALLOWED_TYPES = [
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/gif"
];


/* =========================
   RANDOM NAME
========================= */

function randomName() {

  const chars =
    "abcdefghijklmnopqrstuvwxyz0123456789";

  const bytes =
    new Uint8Array(6);

  crypto.getRandomValues(
    bytes
  );

  let result = "";

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    result +=
      chars[
        bytes[i] %
        chars.length
      ];

  }

  return result;
}


/* =========================
   EXTENSION
========================= */

function getExtension(type) {

  if (
    type === "image/png"
  ) {
    return ".png";
  }

  if (
    type === "image/jpeg"
  ) {
    return ".jpg";
  }

  if (
    type === "image/webp"
  ) {
    return ".webp";
  }

  if (
    type === "image/gif"
  ) {
    return ".gif";
  }

  return "";
}


/* =========================
   SIZE
========================= */

function formatSize(bytes) {

  if (
    bytes < 1024
  ) {
    return (
      bytes +
      " B"
    );
  }

  if (
    bytes < 1024 ** 2
  ) {
    return (
      (bytes / 1024)
        .toFixed(2) +
      " KB"
    );
  }

  if (
    bytes < 1024 ** 3
  ) {
    return (
      (bytes / 1024 ** 2)
        .toFixed(2) +
      " MB"
    );
  }

  return (
    (bytes / 1024 ** 3)
      .toFixed(2) +
    " GB"
  );
}


/* =========================
   ERROR
========================= */

function showError(message) {

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";
}


function hideError() {

  errorBox.style.display =
    "none";
}


/* =========================
   FILE SELECT
========================= */

fileInput.addEventListener(
  "change",
  async () => {

    const file =
      fileInput.files?.[0];

    if (!file) {
      return;
    }

    await uploadImage(
      file
    );

  }
);


/* =========================
   UPLOAD
========================= */

async function uploadImage(file) {

  hideError();

  result.style.display =
    "none";

  preview.style.display =
    "none";


  if (
    !ALLOWED_TYPES.includes(
      file.type
    )
  ) {

    showError(
      "Ảnh không đúng định dạng. Chỉ hỗ trợ PNG, JPG, WEBP và GIF."
    );

    return;
  }


  if (
    file.size >
    MAX_SIZE
  ) {

    showError(
      "Ảnh vượt quá giới hạn 65 GB."
    );

    return;
  }


  /* INFORMATION */

  fileBox.style.display =
    "block";

  fileName.textContent =
    file.name;

  fileSize.textContent =
    formatSize(
      file.size
    );

  fileType.textContent =
    file.type
      .replace(
        "image/",
        ""
      )
      .toUpperCase();


  /* PROGRESS */

  progressBox.style.display =
    "block";

  progressBar.style.width =
    "0%";

  progressText.textContent =
    "0%";

  status.textContent =
    "Đang kết nối...";


  try {

    /*
     * Tên mới:
     *
     * 7fas39.png
     */

    const pathname =
      randomName() +
      getExtension(
        file.type
      );


    const blob =
      await upload(
        pathname,
        file,
        {

          access:
            "public",

          handleUploadUrl:
            "/api/upload",

          multipart:
            true,

          clientPayload:
            JSON.stringify({

              originalName:
                file.name,

              contentType:
                file.type,

              size:
                file.size

            }),

          onUploadProgress:
            ({
              percentage
            }) => {

              const percent =
                Math.round(
                  percentage
                );

              progressBar.style.width =
                percent + "%";

              progressText.textContent =
                percent + "%";


              if (
                percent >=
                100
              ) {

                status.textContent =
                  "Đang hoàn tất...";

              } else {

                status.textContent =
                  "Đang upload ảnh...";

              }

            }

        }
      );


    /*
     * URL Azerst
     */

    const finalURL =
      "https://Azerst-Image-VN.vercel.app/" +
      pathname;


    progressBar.style.width =
      "100%";

    progressText.textContent =
      "100%";

    status.textContent =
      "Upload thành công!";


    urlInput.value =
      finalURL;


    result.style.display =
      "block";


    /*
     * Preview dùng URL Blob thật.
     * Không cần chờ domain rewrite.
     */

    previewImage.src =
      blob.url;

    preview.style.display =
      "block";


    result.scrollIntoView({
      behavior:
        "smooth",
      block:
        "nearest"
    });


  } catch (error) {

    console.error(
      error
    );

    progressBox.style.display =
      "none";

    showError(
      error?.message ||
      "Không thể upload ảnh. Hãy kiểm tra Blob Store và thử lại."
    );

  }

}


/* =========================
   COPY
========================= */

copyButton.addEventListener(
  "click",
  async () => {

    const url =
      urlInput.value;

    if (!url) {
      return;
    }


    try {

      await navigator.clipboard.writeText(
        url
      );

    } catch {

      urlInput.select();

      document.execCommand(
        "copy"
      );

    }


    copyButton.textContent =
      "Đã Sao Chép ✓";


    setTimeout(
      () => {

        copyButton.textContent =
          "Sao Chép";

      },
      1500
    );

  }
);


/* =========================
   OTHER IMAGE
========================= */

otherButton.addEventListener(
  "click",
  () => {

    fileInput.value =
      "";

    result.style.display =
      "none";

    fileBox.style.display =
      "none";

    progressBox.style.display =
      "none";

    preview.style.display =
      "none";

    hideError();

    fileInput.click();

  }
);

</script>
