<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Azerst - CÔNG CỤ CHÈN ẢNH TẠO LINK URL</title>

  <meta
    name="description"
    content="Công cụ chèn ảnh và tạo link URL trực tiếp nhanh chóng từ Azerst. Hỗ trợ Android, iPhone và máy tính."
  >

  <link rel="icon"
    href="https://img-ffvn-tgm-com.vercel.app/images/3rYKxqbI.png"
  >

  <link rel="stylesheet" href="/src/style.css">
</head>

<body>

  <div class="bg-glow"></div>

  <main class="container">

    <section class="card">

      <header class="header">

        <img
          class="logo"
          src="https://img-ffvn-tgm-com.vercel.app/images/3rYKxqbI.png"
          alt="Azerst"
        >

        <div>
          <h1>Azerst Image</h1>
          <p>CÔNG CỤ CHÈN ẢNH TẠO LINK URL</p>
        </div>

      </header>


      <div class="anime-box">

        <div class="anime-character">

          <div class="hair"></div>

          <div class="head">

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="mouth"></div>

          </div>

          <div class="body"></div>

        </div>

        <div class="anime-text">
          <span>AZERST</span>
          <small>IMAGE HOSTING</small>
        </div>

      </div>


      <div class="storage">

        <div>
          <span>DUNG LƯỢNG HỆ THỐNG</span>
          <b>Tối Đa: 65 GB</b>
        </div>

        <div class="storage-bar">
          <div></div>
        </div>

      </div>


      <label class="upload-area" id="uploadArea">

        <input
          id="fileInput"
          type="file"
          accept="image/png,image/jpeg,image/webp,image/gif"
          hidden
        >

        <div class="upload-icon">＋</div>

        <strong>Chèn ảnh</strong>

        <span>
          PNG • JPG • JPEG • WEBP • GIF
        </span>

        <small>
          Nhấn để chọn ảnh từ thiết bị
        </small>

      </label>


      <div id="result" class="result hidden">

        <div class="preview-wrapper">

          <img id="preview" alt="Preview">

        </div>


        <div class="file-info">

          <div class="info-row">
            <span>Tên file</span>
            <b id="fileName">-</b>
          </div>

          <div class="info-row">
            <span>Kích thước</span>
            <b id="fileSize">-</b>
          </div>

          <div class="info-row">
            <span>Định dạng</span>
            <b id="fileType">-</b>
          </div>

          <div class="info-row">
            <span>Trạng thái</span>
            <b id="status">Đang chờ...</b>
          </div>

        </div>


        <div class="progress-box">

          <div class="progress-top">
            <span>Tiến trình tải lên</span>
            <b id="progressText">0%</b>
          </div>

          <div class="progress">
            <div id="progressBar"></div>
          </div>

        </div>


        <div id="urlBox" class="url-box hidden">

          <span>LINK URL ẢNH</span>

          <div class="url-row">

            <input
              id="imageUrl"
              type="text"
              readonly
            >

            <button id="copyBtn">
              Sao chép
            </button>

          </div>

        </div>


        <div class="buttons">

          <button
            id="uploadAnother"
            class="secondary"
          >
            Chèn ảnh khác
          </button>

        </div>

      </div>


      <div id="errorBox" class="error hidden"></div>


      <footer>

        <span>Azerst Image VN</span>

        <span>•</span>

        <span>Fast Image URL</span>

      </footer>

    </section>

  </main>


  <script type="module" src="/src/main.js"></script>

</body>

</html>
